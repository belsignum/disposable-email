<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:mlang_tabs_tab" /></h1>
    <p class="text-body-secondary">
        <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:module.intro" />
        <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:module.listType" />
        <code>{listType}</code>
    </p>

    <f:render section="Check" arguments="{_all}" />

    <div class="row">
        <div class="col-lg-6">
            <f:render section="Rules" arguments="{
                rules: allowRules,
                newUrl: newAllowUrl,
                canModify: canModify,
                ruleType: 'allow',
                icon: 'status-status-permission-granted'
            }" />
        </div>
        <div class="col-lg-6">
            <f:render section="Rules" arguments="{
                rules: denyRules,
                newUrl: newDenyUrl,
                canModify: canModify,
                ruleType: 'deny',
                icon: 'status-status-permission-denied'
            }" />
        </div>
    </div>
</f:section>

<f:section name="Check">
    <div class="panel panel-default">
        <div class="panel-heading">
            <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.title" />
        </div>
        <div class="panel-body">
            <form action="{moduleUrl}" method="post" class="row g-2 align-items-end mb-3">
                <div class="col-sm-8 col-md-6">
                    <label for="disposable-email-check" class="form-label">
                        <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.label" />
                    </label>
                    <input type="text" class="form-control" id="disposable-email-check" name="check" value="{check}" placeholder="name@example.com" />
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-default">
                        <core:icon identifier="actions-search" />
                        <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.submit" />
                    </button>
                </div>
            </form>

            <f:if condition="{checkResult}">
                <f:if condition="{checkResult.valid}">
                    <f:then>
                        <f:render section="CheckResult" arguments="{result: checkResult, canModify: canModify}" />
                    </f:then>
                    <f:else>
                        <f:be.infobox state="1">
                            <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.invalid" />
                        </f:be.infobox>
                    </f:else>
                </f:if>
            </f:if>
        </div>
    </div>
</f:section>

<f:section name="CheckResult">
    <f:if condition="{result.validationDisabled}">
        <f:then>
            <f:be.infobox state="-1" title="{result.domain}">
                <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.result.disabled" />
            </f:be.infobox>
        </f:then>
        <f:else if="{result.blocked}">
            <f:be.infobox state="2" title="{result.domain}">
                <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.result.blocked" />
            </f:be.infobox>
        </f:else>
        <f:else>
            <f:be.infobox state="0" title="{result.domain}">
                <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.result.accepted" />
            </f:be.infobox>
        </f:else>
    </f:if>

    <dl class="row">
        <dt class="col-sm-3"><f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.rule" /></dt>
        <dd class="col-sm-9">
            <f:if condition="{result.rule}">
                <f:then><f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:rules.{result.rule}.title" /></f:then>
                <f:else>–</f:else>
            </f:if>
        </dd>
        <dt class="col-sm-3"><f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.lists" /></dt>
        <dd class="col-sm-9">
            <f:for each="{result.providerTypes}" as="providerType" iteration="i">
                <span class="badge {f:if(condition: providerType.active, then: 'badge-danger', else: 'badge-default')}">
                    <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:providerType.{providerType.type}" />
                </span>
            </f:for>
            <f:if condition="{result.providerTypes}">
                <f:then>
                    <div class="form-text"><f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.lists.hint" /></div>
                </f:then>
                <f:else>–</f:else>
            </f:if>
        </dd>
    </dl>

    <f:if condition="{canModify} && !{result.rule}">
        <div class="btn-group">
            <a href="{result.newAllowUrl}" class="btn btn-default">
                <core:icon identifier="status-status-permission-granted" />
                <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.addAllow" />
            </a>
            <a href="{result.newDenyUrl}" class="btn btn-default">
                <core:icon identifier="status-status-permission-denied" />
                <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:check.addDeny" />
            </a>
        </div>
    </f:if>
</f:section>

<f:section name="Rules">
    <div class="panel panel-default">
        <div class="panel-heading d-flex justify-content-between align-items-center">
            <span>
                <core:icon identifier="{icon}" />
                <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:rules.{ruleType}.title" />
                <span class="badge badge-default">{rules -> f:count()}</span>
            </span>
            <f:if condition="{canModify}">
                <a href="{newUrl}" class="btn btn-default btn-sm">
                    <core:icon identifier="actions-add" />
                    <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:rules.new" />
                </a>
            </f:if>
        </div>
        <div class="panel-body">
            <p class="text-body-secondary">
                <f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:rules.{ruleType}.description" />
            </p>
        </div>
        <f:if condition="{rules}">
            <f:then>
                <div class="table-fit">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th><f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_db.xlf:tx_disposableemail_domain_rule.domain" /></th>
                                <th><f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_db.xlf:tx_disposableemail_domain_rule.note" /></th>
                                <f:if condition="{canModify}"><th></th></f:if>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{rules}" as="rule">
                                <tr class="{f:if(condition: rule.hidden, then: 'text-body-secondary')}">
                                    <td>
                                        <f:if condition="{rule.hidden}">
                                            <core:icon identifier="overlay-hidden" />
                                        </f:if>
                                        <code>{rule.domain}</code>
                                    </td>
                                    <td>{rule.note -> f:format.crop(maxCharacters: 80)}</td>
                                    <f:if condition="{canModify}">
                                        <td class="col-control nowrap">
                                            <div class="btn-group">
                                                <a href="{rule.editUrl}" class="btn btn-default" title="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:edit')}">
                                                    <core:icon identifier="actions-open" />
                                                </a>
                                                <f:if condition="{rule.hidden}">
                                                    <f:then>
                                                        <a href="{rule.toggleUrl}" class="btn btn-default" title="{f:translate(key: 'LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:rules.enable')}">
                                                            <core:icon identifier="actions-edit-unhide" />
                                                        </a>
                                                    </f:then>
                                                    <f:else>
                                                        <a href="{rule.toggleUrl}" class="btn btn-default" title="{f:translate(key: 'LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:rules.disable')}">
                                                            <core:icon identifier="actions-edit-hide" />
                                                        </a>
                                                    </f:else>
                                                </f:if>
                                                <a href="{rule.deleteUrl}"
                                                   class="btn btn-default t3js-modal-trigger"
                                                   title="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:delete')}"
                                                   data-severity="warning"
                                                   data-title="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:delete')}"
                                                   data-bs-content="{f:translate(key: 'LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:rules.delete.confirm', arguments: {0: rule.domain})}"
                                                   data-button-close-text="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:cancel')}"
                                                   data-button-ok-text="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:delete')}">
                                                    <core:icon identifier="actions-edit-delete" />
                                                </a>
                                            </div>
                                        </td>
                                    </f:if>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <div class="panel-body pt-0">
                    <em><f:translate key="LLL:EXT:disposable_email/Resources/Private/Language/locallang_mod.xlf:rules.empty" /></em>
                </div>
            </f:else>
        </f:if>
    </div>
</f:section>

</html>
